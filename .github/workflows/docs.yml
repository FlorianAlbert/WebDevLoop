name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.81.0

      - name: Generate the code reference (XML comments)
        working-directory: docs
        run: docfx metadata docfx.json

      - name: Generate the REST API reference (OpenAPI)
        run: docs/tools/generate-openapi.sh

      - name: Build the site
        working-directory: docs
        run: docfx build docfx.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
